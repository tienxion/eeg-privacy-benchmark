project:
  name: eeg_privacy_benchmark
  phase: lee_compact_federated_confidence_penalty
  status: complete

scope:
  dataset: lee2019_mi
  subjects: [1, 2, 3, 4, 5, 6]
  protocol: cross_session
  screening_seed: 13
  confirmation_seeds: [17, 19, 23]

matched_federated_setting:
  resample_hz: 250
  normalization: per_trial_channel
  classifier_head: global_average
  rounds: 160
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.001
  validation_fraction: 0.2
  early_stopping_patience: 80
  checkpoint_interval: 1

defense:
  type: confidence_penalty
  confidence_penalty_beta: 0.05
  rationale: transfer_existing_untuned_compact_default

decision_rule: >-
  Run seed 13 once with exact checkpoint resume and reuse the fitted model for
  every privacy attack. Continue seeds 17,19,23 only if held-out task balanced
  accuracy is at least 0.60. Keep beta and the calibrated 160-round budget fixed.
  Do not select or stop based on privacy metrics.

