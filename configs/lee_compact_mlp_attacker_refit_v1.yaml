project:
  name: eeg_privacy_benchmark
  phase: lee_compact_mlp_attacker_refit
  status: complete

scope:
  dataset: lee2019_mi
  subjects: [1, 2, 3, 4, 5, 6]
  protocol: cross_session
  task_seeds: [13, 17, 19, 23]
  attacker_seeds: [101, 103, 107]
  task_model_retraining: false
  source: completed_posterior_caches

models:
  - compact_eegnet
  - compact_bottleneck_dim6
  - compact_confidence_penalty_beta0p05

attack:
  attack_type: mlp
  score_type: posterior_probabilities

decision_rule: >-
  For each attacker seed, pair defense and baseline AUCs on task seeds
  13,17,19,23. Call a defense refit-stable only if the paired mean delta has
  the same direction for all attacker seeds. Report all deltas within 0.01 as a
  practical tie. Do not retrain or alter any task model.

