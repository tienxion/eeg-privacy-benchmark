name: public-v1.2-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-download-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify development output-stream aggregates without dependencies
        run: |
          python scripts/check_output_stream_evidence.py --test
          python scripts/check_output_stream_evidence.py
      - name: Install validated dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Whitespace check
        run: git diff --check
      - name: Compile, import, parse configs, and run no-download smoke
        run: python scripts/check_public_smoke.py
      - name: Validate Cho2017 contract and split plumbing without data
        run: |
          PYTHONPATH=src python scripts/check_cho2017_validation_contract.py
          PYTHONPATH=src python scripts/check_cho2017_split_plumbing.py
      - name: Validate Shin2017A public evidence and plumbing without data
        run: |
          PYTHONPATH=src python scripts/check_shin2017a_public_evidence.py
          PYTHONPATH=src python scripts/check_shin2017a_split_plumbing.py
          PYTHONPATH=src python scripts/check_shin2017a_nemar_loader.py
      - name: Validate public inventory, links, paths, licenses, and checksums
        run: >-
          python scripts/check_public_release.py
          --allow-remote origin
          --identity-ref "${{ github.event.pull_request.head.sha || github.sha }}"
